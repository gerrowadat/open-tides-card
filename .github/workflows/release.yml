# Release on tag `vX.Y.Z`: test, build, attach dist/open-tides-card.js.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p 'require("./package.json").version')"
          [ "$tag" = "$ver" ] || { echo "tag $tag != package.json $ver"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: hacs/action@main
        with:
          category: plugin
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/open-tides-card.js
          generate_release_notes: true
